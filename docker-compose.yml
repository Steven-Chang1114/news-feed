# Local Postgres for development only. Production uses managed Postgres on Render.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: news-feed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: newsfeed
      POSTGRES_PASSWORD: newsfeed
      POSTGRES_DB: newsfeed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsfeed -d newsfeed"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
