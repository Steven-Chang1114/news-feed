# Render blueprint. One web service serving the API and the built client, so there
# is a single origin and no CORS in production, plus the Postgres it talks to.
#
# The free database is deleted 30 days after creation, with a 14-day grace period to
# upgrade. See the hosting note in README.md.
services:
  - type: web
    name: news-feed
    runtime: node
    plan: free
    region: oregon

    # `npm ci` installs from the lockfile, so a deploy resolves the same versions
    # that were tested. `npm run build` builds the client, then bundles the server.
    buildCommand: npm ci && npm run build
    # Applies pending migrations, then starts the server.
    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      # Injected by Render from the database below, so the connection string is
      # never copied by hand and never leaves the platform.
      - key: DATABASE_URL
        fromDatabase:
          name: news-feed-db
          property: connectionString
      # sync: false keeps these out of the repository — set each in the Render
      # dashboard, where it is stored encrypted.
      - key: GNEWS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: news-feed-db
    plan: free
    region: oregon
    # Reached over Render's private network from the service above, so it is not
    # exposed to the public internet.
    ipAllowList: []
